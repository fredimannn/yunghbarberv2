<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunghbarber | Reserva tu Hora</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header-bar">
        <div class="logo">
            <h1>YUNGHBARBER</h1>
            <p>Cortes modernos & a domicilio</p>
        </div>
        <a href="barber.html" class="btn-panel">Panel Barbero ⚙️</a>
    </header>

    <main class="contenedor-principal">
        <!-- Formulario de Agendamiento -->
        <section class="card-box">
            <form id="form-agenda">
                <div class="campo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu Nombre" required>
                </div>

                <!-- Calendario Interactivo Idéntico -->
                <div class="campo">
                    <label>Seleccionar Fecha:</label>
                    <div class="calendar-widget" id="client-calendar-widget">
                        <div class="cal-header-selected" id="cal-selected-label">
                            Miércoles, 12 De Agosto
                        </div>
                        
                        <div class="cal-nav-bar">
                            <span class="cal-month-title" id="cal-month-title">Agosto De 2026</span>
                            <div class="cal-nav-btns">
                                <button type="button" class="btn-cal-nav" id="btn-prev-month">▲</button>
                                <button type="button" class="btn-cal-nav" id="btn-next-month">▼</button>
                            </div>
                        </div>

                        <div class="cal-weekdays">
                            <span>lu</span><span>ma</span><span>mi</span><span>ju</span><span>vi</span><span>sá</span><span>do</span>
                        </div>

                        <div class="cal-days-grid" id="cal-days-grid"></div>
                    </div>

                    <input type="hidden" id="fecha" name="fecha" required>
                </div>

                <!-- Selección de Horario -->
                <div class="campo">
                    <label>Horarios Disponibles:</label>
                    <div class="grid-horarios" id="selector-horarios">
                        <button type="button" class="btn-hora" data-hora="10:00">10:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="11:00">11:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="12:00">12:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="15:00">15:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="16:00">16:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="17:00">17:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="18:00">18:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="19:00">19:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="20:00">20:00 hrs</button>
                    </div>
                    <input type="hidden" id="hora" name="hora" required>
                </div>

                <div class="campo">
                    <label for="servicio">Servicio:</label>
                    <select id="servicio" name="servicio" required>
                        <option value="Corte Moderno / Degradado ($10.000)">Corte Moderno / Degradado ($10.000)</option>
                        <option value="Perfilado de Barba ($5.000)">Perfilado de Barba ($5.000)</option>
                        <option value="Corte + Barba ($13.000)">Corte + Barba ($13.000)</option>
                    </select>
                </div>

                <button type="submit" class="btn-confirmar">Agendar Hora 🚀</button>
            </form>
        </section>

        <!-- Redes & Opiniones -->
        <section class="card-box seccion-opiniones">
            <h3 class="subtitulo-seccion">⭐ REDES & OPINIONES</h3>

            <div class="grid-redes">
                <a href="https://www.instagram.com/yunghbarber" target="_blank" rel="noopener noreferrer" class="card-red">
                    <span>Trabajo ✂️</span>
                    <small>@yunghbarber</small>
                </a>
                <a href="https://www.instagram.com/yunghtbl" target="_blank" rel="noopener noreferrer" class="card-red">
                    <span>Personal 👤</span>
                    <small>@yunghtbl</small>
                </a>
            </div>

            <!-- Formulario de Reseñas -->
            <div class="box-dejartu-resena">
                <p class="titulo-deja-resena">Deja tu reseña:</p>
                
                <form id="form-resena">
                    <input type="text" id="resena-nombre" placeholder="Tu Nombre" required>
                    
                    <div class="rating-container">
                        <label>Calificación:</label>
                        <div class="stars" id="rating-stars">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>

                    <textarea id="resena-comentario" placeholder="Escribe tu opinión sobre el corte..." required></textarea>

                    <button type="submit" class="btn-publicar">Publicar Opinión ✍️</button>
                </form>
            </div>

            <div id="lista-resenas" class="lista-resenas-container"></div>
        </section>
    </main>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
