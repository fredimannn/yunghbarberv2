<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunghbarber | Reserva tu Hora</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header-bar">
        <div class="logo">
            <h1>YUNGHBARBER</h1>
            <p>Cortes modernos & a domicilio</p>
        </div>
        <a href="barber.html" class="btn-panel">Panel Barbero ⚙️</a>
    </header>

    <main class="contenedor-principal">
        <!-- Paso 1: Selección de Fecha, Horario y Servicio -->
        <section class="card-box">
            <form id="form-agenda" novalidate onsubmit="return false;">
                <!-- Calendario Interactivo -->
                <div class="campo">
                    <label>Seleccionar Fecha:</label>
                    <div class="calendar-widget" id="client-calendar-widget">
                        <div class="cal-header-selected" id="cal-selected-label">
                            Martes, 18 De Agosto
                        </div>
                        
                        <div class="cal-nav-bar">
                            <span class="cal-month-title" id="cal-month-title">Agosto De 2026</span>
                            <div class="cal-nav-btns">
                                <button type="button" class="btn-cal-nav" id="btn-prev-month">▲</button>
                                <button type="button" class="btn-cal-nav" id="btn-next-month">▼</button>
                            </div>
                        </div>

                        <div class="cal-weekdays">
                            <span>lu</span><span>ma</span><span>mi</span><span>ju</span><span>vi</span><span>sá</span><span>do</span>
                        </div>

                        <div class="cal-days-grid" id="cal-days-grid"></div>
                    </div>

                    <input type="hidden" id="fecha" name="fecha" value="2026-08-18">
                </div>

                <!-- Selección de Horario -->
                <div class="campo">
                    <label>Horarios Disponibles:</label>
                    <div class="grid-horarios" id="selector-horarios">
                        <button type="button" class="btn-hora" data-hora="10:00">10:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="11:00">11:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="12:00">12:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="15:00">15:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="16:00">16:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="17:00">17:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="18:00">18:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="19:00">19:00 hrs</button>
                        <button type="button" class="btn-hora" data-hora="20:00">20:00 hrs</button>
                    </div>
                    <input type="hidden" id="hora" name="hora">
                    <small id="err-hora" class="error-msg"></small>
                </div>

                <!-- Selección de Servicio -->
                <div class="campo">
                    <label for="servicio">Servicio:</label>
                    <select id="servicio" name="servicio">
                        <option value="Corte Moderno / Degradado ($10.000)">Corte Moderno / Degradado ($10.000)</option>
                        <option value="Perfilado de Barba ($5.000)">Perfilado de Barba ($5.000)</option>
                        <option value="Corte + Barba ($13.000)">Corte + Barba ($13.000)</option>
                    </select>
                </div>

                <button type="button" id="btn-abrir-modal" class="btn-confirmar">Continuar con la Reserva 🚀</button>
            </form>
        </section>

        <!-- Redes & Opiniones -->
        <section class="card-box seccion-opiniones">
            <h3 class="subtitulo-seccion">⭐ REDES & OPINIONES</h3>

            <div class="grid-redes">
                <a href="https://www.instagram.com/yunghbarber" target="_blank" rel="noopener noreferrer" class="card-red">
                    <span>Trabajo ✂️</span>
                    <small>@yunghbarber</small>
                </a>
                <a href="https://www.instagram.com/yunghtbl" target="_blank" rel="noopener noreferrer" class="card-red">
                    <span>Personal 👤</span>
                    <small>@yunghtbl</small>
                </a>
            </div>

            <!-- Formulario de Reseñas -->
            <div class="box-dejartu-resena">
                <p class="titulo-deja-resena">Deja tu reseña:</p>
                
                <form id="form-resena">
                    <input type="text" id="resena-nombre" placeholder="Tu Nombre" required>
                    
                    <div class="rating-container">
                        <label>Calificación:</label>
                        <div class="stars" id="rating-stars">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>

                    <textarea id="resena-comentario" placeholder="Escribe tu opinión sobre el corte..." required></textarea>

                    <button type="submit" class="btn-publicar">Publicar Opinión ✍️</button>
                </form>
            </div>

            <div id="lista-resenas" class="lista-resenas-container"></div>
        </section>
    </main>

    <!-- Modal Paso 2: Datos de Contacto del Cliente -->
    <div id="modal-datos-cliente" class="modal-auth-container" style="display: none;">
        <div class="card-box card-auth">
            <h2>💈 Confirmar Datos</h2>
            <p id="resumen-reserva-txt" style="color: #fbbf24; font-size: 0.9rem; margin-top: 6px;"></p>
            
            <form id="form-datos-finales" style="margin-top: 15px;" novalidate>
                <div class="campo">
                    <label for="cliente-nombre" style="text-align: left;">Nombre Completo:</label>
                    <input type="text" id="cliente-nombre" placeholder="Ej: Juanito Pérez" autocomplete="off" required>
                    <small id="err-cliente-nombre" class="error-msg"></small>
                </div>

                <div class="campo">
                    <label for="cliente-telefono" style="text-align: left;">Teléfono / WhatsApp (Chile):</label>
                    <!-- Contenedor horizontal bloqueado con inline-style para máxima prioridad -->
                    <div class="input-tel-container" style="display: flex !important; flex-direction: row !important; align-items: center !important; background-color: #03050a !important; border: 1px solid #182232 !important; border-radius: 8px !important; overflow: hidden !important; width: 100% !important;">
                        <span class="prefijo-box" style="background-color: #0e1624 !important; color: #fbbf24 !important; font-weight: bold !important; font-size: 0.95rem !important; padding: 12px 14px !important; border-right: 1px solid #182232 !important; white-space: nowrap !important; user-select: none !important;">+56 9</span>
                        <input 
                            type="text" 
                            id="cliente-telefono" 
                            placeholder="12345678" 
                            maxlength="8" 
                            autocomplete="off"
                            style="background-color: transparent !important; border: none !important; color: #ffffff !important; padding: 12px !important; border-radius: 0 !important; outline: none !important; font-size: 0.95rem !important; width: 100% !important; flex: 1 !important;"
                            required
                        >
                    </div>
                    <small id="err-cliente-telefono" class="error-msg"></small>
                </div>

                <div class="campo">
                    <label for="cliente-correo" style="text-align: left;">Correo Electrónico:</label>
                    <input type="text" id="cliente-correo" placeholder="cliente@correo.com" autocomplete="off" required>
                    <small id="err-cliente-correo" class="error-msg"></small>
                </div>

                <button type="submit" id="btn-confirmar-cita" class="btn-confirmar">Confirmar y Agendar ✂️</button>
                <button type="button" id="btn-cerrar-modal" class="btn-cancelar-modal" style="width: 100% !important; background-color: #0e1624 !important; border: 1px solid #1a2536 !important; color: #9ca3af !important; padding: 10px 14px !important; border-radius: 8px !important; cursor: pointer !important; font-size: 0.85rem !important; margin-top: 10px !important;">Volver / Modificar</button>
            </form>
        </div>
    </div>

    <!-- Script Nativo para la Vista y Modal -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnsHora = document.querySelectorAll('.btn-hora');
            const inputHora = document.getElementById('hora');
            const errHora = document.getElementById('err-hora');
            const btnAbrir = document.getElementById('btn-abrir-modal');
            const modal = document.getElementById('modal-datos-cliente');
            const btnCerrar = document.getElementById('btn-cerrar-modal');
            const txtResumen = document.getElementById('resumen-reserva-txt');
            const txtTel = document.getElementById('cliente-telefono');

            // 1. Selección de Horas
            btnsHora.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.disabled) return;
                    btnsHora.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (inputHora) inputHora.value = btn.getAttribute('data-hora');
                    if (errHora) errHora.textContent = '';
                });
            });

            // 2. Abrir Modal
            if (btnAbrir) {
                btnAbrir.addEventListener('click', () => {
                    const horaSeleccionada = inputHora ? inputHora.value : '';
                    if (!horaSeleccionada) {
                        if (errHora) errHora.textContent = '⚠️ Selecciona un horario disponible antes de continuar.';
                        return;
                    }

                    const fecha = document.getElementById('fecha') ? document.getElementById('fecha').value : '2026-08-18';
                    const servicio = document.getElementById('servicio') ? document.getElementById('servicio').value : '';

                    if (txtResumen) {
                        txtResumen.textContent = `📅 ${fecha} | ⏰ ${horaSeleccionada} hrs | ✂️ ${servicio}`;
                    }

                    if (modal) {
                        modal.style.display = 'flex';
                    }
                });
            }

            // 3. Cerrar Modal
            if (btnCerrar && modal) {
                btnCerrar.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }

            // 4. Solo permitir números en el teléfono (8 dígitos restantes tras el +56 9)
            if (txtTel) {
                txtTel.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
                });
            }
        });
    </script>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
